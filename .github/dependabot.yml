version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      routine-npm-updates:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # VitePress 1.6.4 declares markdown-it-mathjax3 ^4 as its peer contract.
      - dependency-name: markdown-it-mathjax3
        update-types: ['version-update:semver-major']
      # Наши плагины в .vitepress/markdown получают инстанс markdown-it от
      # VitePress, а он держит @types/markdown-it ^14.1.2 прямой зависимостью.
      # markdown-it 15 везёт собственные типы: MarkdownIt перестаёт быть типом,
      # исчезает экспорт Options. Типизировать плагины по 15, когда в рантайме
      # приходит объект от 14, нельзя — ждём мажор самого VitePress.
      - dependency-name: markdown-it
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/markdown-it'
        update-types: ['version-update:semver-major']
      # typescript-eslint 8.63 supports TypeScript versions below 6.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        patterns: ['*']
