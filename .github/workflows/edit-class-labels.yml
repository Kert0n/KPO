name: Edit class labels

# Переносит отмеченный в шаблоне класс правки в метку (см. scripts/edit-class-labels.mts).
# Только при открытии: метку, переставленную мейнтейнером, workflow не откатывает.
# pull_request_target нужен, чтобы ставить метки на PR из fork; код PR не запускается:
# checkout берёт ветку по умолчанию, а тело PR читается как данные.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  push:
    branches: [master]
    paths:
      - scripts/edit-class-labels.mts
      - .github/workflows/edit-class-labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync-labels:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node --experimental-strip-types scripts/edit-class-labels.mts sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apply-labels:
    if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      # Данные события идут через env, а не подстановкой в команду: тело пишет автор issue.
      - run: node --experimental-strip-types scripts/edit-class-labels.mts apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_KIND: ${{ github.event_name == 'issues' && 'issue' || 'pull_request' }}
          EVENT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          EVENT_BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
